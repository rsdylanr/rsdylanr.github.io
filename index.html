<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>On The Record (OTR) | Legal Video & Trial Support</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
      html { scroll-behavior: smooth; }
      .hero-gradient {
        background: linear-gradient(135deg, rgba(15,23,42,0.95) 0%, rgba(30,41,59,0.9) 100%);
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script>
      // =========================================================================
      // SITE CONFIGURATION OBJECT
      // Edit this object to completely change all content, text, photos, and structure!
      // =========================================================================
      const SITE_CONFIG = {
        companyName: "On The Record",
        abbreviation: "OTR",
        tagline: "Legal Video & Trial Support Services",
        hero: {
          title: "Precision Legal Video & Trial Support",
          subtitle: "Providing high-turnaround, enterprise-grade litigation services across the Mid-Atlantic. Driven by security, precision, and technology.",
          ctaPrimary: "Schedule a Service",
          ctaSecondary: "Explore Capabilities",
          backgroundImage: "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&q=80&w=1920"
        },
        stats: [
          { label: "Years of Excellence", value: "15+" },
          { label: "Depositions Recorded", value: "10k+" },
          { label: "Turnaround Time", value: "Same-Day" },
          { label: "Coverage Footprint", value: "Global" }
        ],
        services: {
          title: "Our Core Services",
          subtitle: "Bespoke multimedia solutions meticulously engineered for court reporting agencies and law firms.",
          items: [
            {
              icon: "video",
              title: "Video Depositions",
              description: "All-digital high-definition recording with multi-camera setups. Optional same-day digital media delivery."
            },
            {
              icon: "refresh-cw",
              title: "Transcript Synchronization",
              description: "Seamless synchronization of video feeds with official transcripts, perfectly formatted for all legal software suites."
            },
            {
              icon: "edit",
              title: "Editing & Redactions",
              description: "On-the-fly clip creation, page/line audio redactions, and precision media treatment for trial display."
            },
            {
              icon: "gavel",
              title: "Courtroom Playback",
              description: "End-to-end hot-seat operation, evidence presentation systems, Elmo visualizers, and courtroom audio support."
            }
          ]
        },
        coverage: {
          title: "Regional Coverage Footprint",
          subtitle: "Deploying certified tech specialists dynamically across the major Mid-Atlantic hubs and hosting remote proceedings globally.",
          states: ["Pennsylvania", "Delaware", "New Jersey", "Maryland", "New York", "Washington, D.C."]
        },
        trustedBy: {
          title: "Who We've Worked With",
          subtitle: "Trusted by top-tier law firms, corporate legal teams, and independent court reporting bureaus.",
          clients: [
            { name: "Apex Litigation Solutions", logoText: "ALS" },
            { name: "Vanguard Court Reporting", logoText: "VCR" },
            { name: "Beacon Legal Group", logoText: "BLG" },
            { name: "Summit Law Partners", logoText: "SLP" },
            { name: "Keystone Depositions", logoText: "KEY" }
          ]
        },
        staff: {
          title: "Meet Our Experts",
          subtitle: "The highly specialized production, technical, and trial support engineers behind every successful assignment.",
          directory: [
            {
              name: "Marck P. Reisbord",
              role: "Founder & Chief Legal Videographer",
              bio: "Specializing in high-profile deposition recordings and complex trial presentation setups for over two decades.",
              photo: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=400&h=400"
            },
            {
              name: "Jennifer Braverman Reisbord, RN",
              role: "Operations & Medical Litigation Consultant",
              bio: "Bringing clinical healthcare expertise to medical malpractice trial prep, timeline parsing, and operational oversight.",
              photo: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400&h=400"
            }
          ]
        },
        bookingForm: {
          title: "Secure Intake & Scheduling Portal",
          subtitle: "Submit case specifications directly to our scheduling desk. All submissions are encrypted and processed securely."
        },
        footer: {
          tagline: "Securing the record, elevating the presentation. From discovery to verdict.",
          address: "Center City, Philadelphia, PA",
          phone: "(215) 555-0190",
          email: "operations@otrlv.com"
        }
      };

      // =========================================================================
      // NATIVE REACT WITHOUT BUILD TOOLS (Runs natively on GitHub Pages)
      // =========================================================================
      const e = React.createElement;

      function App() {
        const [formData, setFormData] = React.useState({
          name: '', email: '', firm: '', serviceType: 'Video Deposition', date: '', details: ''
        });
        const [isSubmitted, setIsSubmitted] = React.useState(false);

        const handleInputChange = (event) => {
          const { name, value } = event.target;
          setFormData(prev => Object.assign({}, prev, { [name]: value }));
        };

        const handleSubmit = (event) => {
          event.preventDefault();
          setIsSubmitted(true);
          setTimeout(() => {
            setIsSubmitted(false);
            setFormData({ name: '', email: '', firm: '', serviceType: 'Video Deposition', date: '', details: '' });
          }, 4000);
        };

        const renderIcon = (name) => {
          let paths = [];
          if (name === 'video') {
            paths = [
              e('path', { d: "m22 8-6 4 6 4V8Z", key: 1 }),
              e('rect', { width: "14", height: "12", x: "2", y: "6", rx: "2", ry: "2", key: 2 })
            ];
          } else if (name === 'refresh-cw') {
            paths = [
              e('path', { d: "M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8", key: 1 }),
              e('path', { d: "M3 3v5h5", key: 2 }),
              e('path', { d: "M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16", key: 3 }),
              e('path', { d: "M16 16h5v5", key: 4 })
            ];
          } else if (name === 'edit') {
            paths = [
              e('path', { d: "M12 20h9", key: 1 }),
              e('path', { d: "M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z", key: 2 })
            ];
          } else if (name === 'gavel') {
            paths = [
              e('path', { d: "m14 13-5 5 2 2 5-5-2-2z", key: 1 }),
              e('path', { d: "m21 10-5-5-2 2 5 5 2-2z", key: 2 }),
              e('path', { d: "M3 21h18", key: 3 }),
              e('path', { d: "M14 13 5 4", strokeLinecap: "round", key: 4 })
            ];
          }
          return e('svg', { class: "w-6 h-6", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2" }, paths);
        };

        return e('div', { class: "min-h-screen flex flex-col justify-between" },
          // Header Navigation
          e('header', { class: "sticky top-0 z-50 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-6 py-4" },
            e('div', { class: "max-w-7xl mx-auto flex items-center justify-between" },
              e('div', { class: "flex items-center space-x-3" },
                e('div', { class: "bg-blue-600 text-white font-black text-xl px-3 py-1 rounded tracking-tighter" }, SITE_CONFIG.abbreviation),
                e('span', { class: "text-xl font-bold tracking-tight text-white hidden sm:inline" }, SITE_CONFIG.companyName)
              ),
              e('nav', { class: "hidden md:flex space-x-8 text-sm font-medium text-slate-400" },
                e('a', { href: "#services", class: "hover:text-blue-400 transition" }, "Services"),
                e('a', { href: "#coverage", class: "hover:text-blue-400 transition" }, "Coverage"),
                e('a', { href: "#clients", class: "hover:text-blue-400 transition" }, "Clients"),
                e('a', { href: "#team", class: "hover:text-blue-400 transition" }, "Our Team")
              ),
              e('div', null,
                e('a', { href: "#book", class: "bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-5 py-2.5 rounded transition shadow-lg shadow-blue-600/20" }, SITE_CONFIG.hero.ctaPrimary)
              )
            )
          ),

          // Hero Core Section
          e('section', { class: "relative min-h-[85vh] flex items-center justify-center bg-cover bg-center", style: { backgroundImage: `url(${SITE_CONFIG.hero.backgroundImage})` } },
            e('div', { class: "absolute inset-0 hero-gradient" }),
            e('div', { class: "relative max-w-5xl mx-auto px-6 py-24 text-center z-10" },
              e('span', { class: "inline-flex items-center gap-1.5 py-1 px-3 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 mb-6" },
                e('span', { class: "w-2 h-2 rounded-full bg-blue-400 animate-pulse" }), " Premium Trial Support & Litigation Solutions"
              ),
              e('h1', { class: "text-4xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight leading-none mb-6" }, SITE_CONFIG.hero.title),
              e('p', { class: "text-lg md:text-xl text-slate-300 max-w-3xl mx-auto mb-10 font-normal leading-relaxed" }, SITE_CONFIG.hero.subtitle),
              e('div', { class: "flex flex-col sm:flex-row justify-center items-center gap-4" },
                e('a', { href: "#book", class: "w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white font-semibold px-8 py-4 rounded shadow-xl shadow-blue-600/20 transition text-center" }, SITE_CONFIG.hero.ctaPrimary),
                e('a', { href: "#services", class: "w-full sm:w-auto bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold px-8 py-4 rounded backdrop-blur transition text-center" }, SITE_CONFIG.hero.ctaSecondary)
              )
            )
          ),

          // Numeric Stats Row
          e('section', { class: "bg-slate-950 border-y border-slate-800 py-12 px-6" },
            e('div', { class: "max-w-7xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8 text-center" },
              SITE_CONFIG.stats.map((stat, idx) => (
                e('div', { key: idx },
                  e('div', { class: "text-3xl md:text-4xl font-extrabold text-blue-500 mb-1" }, stat.value),
                  e('div', { class: "text-xs md:text-sm text-slate-400 font-medium uppercase tracking-wider" }, stat.label)
                )
              ))
            )
          ),

          // Main Services Section
          e('section', { id: "services", class: "py-24 px-6 max-w-7xl mx-auto w-full" },
            e('div', { class: "text-center mb-16" },
              e('h2', { class: "text-3xl font-bold tracking-tight text-white sm:text-4xl mb-4" }, SITE_CONFIG.services.title),
              e('p', { class: "text-slate-400 max-w-2xl mx-auto" }, SITE_CONFIG.services.subtitle)
            ),
            e('div', { class: "grid md:grid-cols-2 lg:grid-cols-4 gap-6" },
              SITE_CONFIG.services.items.map((srv, idx) => (
                e('div', { key: idx },
                  e('div', { class: "bg-slate-800/40 border border-slate-800 p-6 rounded-xl hover:border-blue-500/50 transition h-full flex flex-col justify-between" },
                    e('div', null,
                      e('div', { class: "w-12 h-12 rounded-lg bg-blue-600/10 border border-blue-500/20 text-blue-500 flex items-center justify-center mb-5" }, renderIcon(srv.icon)),
                      e('h3', { class: "text-xl font-bold text-white mb-2" }, srv.title),
                      e('p', { class: "text-slate-400 text-sm leading-relaxed" }, srv.description)
                    )
                  )
                )
              ))
            )
          ),

          // Regional Map Footprint Layout
          e('section', { id: "coverage", class: "py-20 px-6 bg-slate-950 border-y border-slate-800" },
            e('div', { class: "max-w-7xl mx-auto lg:flex lg:items-center lg:justify-between gap-12" },
              e('div', { class: "lg:w-1/2 mb-10 lg:mb-0" },
                e('h2', { class: "text-3xl font-bold tracking-tight text-white sm:text-4xl mb-4" }, SITE_CONFIG.coverage.title),
                e('p', { class: "text-slate-400 mb-8 leading-relaxed" }, SITE_CONFIG.coverage.subtitle),
                e('div', { class: "grid grid-cols-2 sm:grid-cols-3 gap-4" },
                  SITE_CONFIG.coverage.states.map((state, idx) => (
                    e('div', { key: idx, class: "bg-slate-900 border border-slate-800 rounded-lg p-3 text-center font-semibold text-sm text-slate-300" }, state)
                  ))
                )
              ),
              e('div', { class: "lg:w-1/2 bg-slate-900 border border-slate-800 p-8 rounded-2xl flex flex-col justify-between min-h-[300px]" },
                e('div', null,
                  e('span', { class: "text-xs font-bold uppercase text-blue-500 tracking-wider" }, "Operational Radius"),
                  e('h3', { class: "text-xl font-bold text-white mt-1 mb-4" }, "Mid-Atlantic Core Corridor"),
                  e('p', { class: "text-sm text-slate-400 leading-relaxed" }, "Our legal videographers and hot-seat managers travel directly with customized hardware nodes to courtrooms, firm boardrooms, and remote deployment sites across the region.")
                ),
                e('div', { class: "border-t border-slate-800 pt-4 mt-6 flex justify-between items-center text-xs text-slate-500" },
                  e('span', null, "Active Status: Deployable"),
                  e('span', { class: "flex items-center gap-1" },
                    e('span', { class: "w-2 h-2 rounded-full bg-green-500" }), " All Hubs Operational"
                  )
                )
              )
            )
          ),

          // Who We've Worked With Layout
          e('section', { id: "clients", class: "py-20 px-6 max-w-7xl mx-auto w-full text-center" },
            e('h2', { class: "text-2xl font-bold text-white tracking-tight mb-2" }, SITE_CONFIG.trustedBy.title),
            e('p', { class: "text-slate-400 text-sm mb-12" }, SITE_CONFIG.trustedBy.subtitle),
            e('div', { class: "grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-6" },
              SITE_CONFIG.trustedBy.clients.map((client, idx) => (
                e('div', { key: idx, class: "bg-slate-800/20 border border-slate-800/80 rounded-xl p-6 flex flex-col items-center justify-center grayscale opacity-75 hover:grayscale-0 hover:opacity-100 transition duration-300" },
                  e('div', { class: "w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center font-bold text-slate-400 text-sm mb-2 tracking-widest border border-slate-700" }, client.logoText),
                  e('span', { class: "text-xs font-semibold text-slate-400 tracking-tight" }, client.name)
                )
              ))
            )
          ),

          // Staff Directory Grid
          e('section', { id: "team", class: "py-24 px-6 bg-slate-950 border-t border-slate-800" },
            e('div', { class: "max-w-7xl mx-auto" },
              e('div', { class: "text-center mb-16" },
                e('h2', { class: "text-3xl font-bold tracking-tight text-white sm:text-4xl mb-4" }, SITE_CONFIG.staff.title),
                e('p', { class: "text-slate-400 max-w-2xl mx-auto" }, SITE_CONFIG.staff.subtitle)
              ),
              e('div', { class: "grid md:grid-cols-2 gap-8 max-w-4xl mx-auto" },
                SITE_CONFIG.staff.directory.map((member, idx) => (
                  e('div', { key: idx, class: "bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col sm:flex-row items-center sm:items-start gap-6 hover:border-slate-700 transition" },
                    e('img', { src: member.photo, alt: member.name, class: "w-24 h-24 rounded-full object-cover border-2 border-slate-800 shrink-0 bg-slate-800" }),
                    e('div', { class: "text-center sm:text-left" },
                      e('h3', { class: "text-xl font-bold text-white" }, member.name),
                      e('p', { class: "text-blue-400 text-xs font-semibold uppercase tracking-wider mb-3" }, member.role),
                      e('p', { class: "text-slate-400 text-sm leading-relaxed" }, member.role === "Founder & Chief Legal Videographer" ? member.bio : member.bio)
                    )
                  )
                ))
              )
            )
          ),

          // Portal Booking Intake
          e('section', { id: "book", class: "py-24 px-6 max-w-3xl mx-auto w-full" },
            e('div', { class: "bg-slate-900 border border-slate-800 rounded-2xl p-8 md:p-10 shadow-2xl relative overflow-hidden" },
              e('div', { class: "absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 to-indigo-600" }),
              e('div', { class: "mb-8" },
                e('h2', { class: "text-2xl font-bold text-white tracking-tight mb-2" }, SITE_CONFIG.bookingForm.title),
                e('p', { class: "text-sm text-slate-400" }, SITE_CONFIG.bookingForm.subtitle)
              ),
              isSubmitted ? 
                e('div', { class: "bg-green-500/10 border border-green-500/20 text-green-400 p-6 rounded-xl text-center" },
                  e('h3', { class: "font-bold text-lg mb-1" }, "Intake Submission Confirmed"),
                  e('p', { class: "text-sm text-green-400/80" }, "Your request has been routed to our Center City ops desk. A service coordinator will follow up shortly.")
                ) : 
                e('form', { onSubmit: handleSubmit, class: "space-y-5" },
                  e('div', { class: "grid sm:grid-cols-2 gap-4" },
                    e('div', null,
                      e('label', { class: "block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" }, "Full Name"),
                      e('input', { type: "text", name: "name", required: true, value: formData.name, onChange: handleInputChange, class: "w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-blue-500", placeholder: "Counsel or Agent" })
                    ),
                    e('div', null,
                      e('label', { class: "block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" }, "Email Address"),
                      e('input', { type: "email", name: "email", required: true, value: formData.email, onChange: handleInputChange, class: "w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-blue-500", placeholder: "name@firm.com" })
                    )
                  ),
                  e('div', { class: "grid sm:grid-cols-2 gap-4" },
                    e('div', null,
                      e('label', { class: "block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" }, "Law Firm / Agency"),
                      e('input', { type: "text", name: "firm", required: true, value: formData.firm, onChange: handleInputChange, class: "w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-blue-500", placeholder: "LLP or Corporate Entities" })
                    ),
                    e('div', null,
                      e('label', { class: "block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" }, "Requested Service Corridor"),
                      e('select', { name: "serviceType", value: formData.serviceType, onChange: handleInputChange, class: "w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-blue-500" },
                        e('option', null, "Video Deposition"),
                        e('option', null, "Transcript Syncing"),
                        e('option', null, "Courtroom Trial Playback"),
                        e('option', null, "Custom Video Redaction")
                      )
                    )
                  ),
                  e('div', null,
                    e('label', { class: "block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" }, "Proceeding Date"),
                    e('input', { type: "date", name: "date", required: true, value: formData.date, onChange: handleInputChange, class: "w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-blue-500" })
                  ),
                  e('div', null,
                    e('label', { class: "block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5" }, "Matter Details / Special Requirements"),
                    e('textarea', { name: "details", rows: "3", value: formData.details, onChange: handleInputChange, class: "w-full bg-slate-950 border border-slate-800 rounded p-3 text-sm text-white focus:outline-none focus:border-blue-500", placeholder: "List tracking numbers, notice specifications, remote links, or courthouse locations..." })
                  ),
                  e('button', { type: "submit", class: "w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded tracking-wide shadow-lg shadow-blue-600/10 transition" }, "Transmit Secure Scheduling Request")
                )
            )
          ),

          // Footer Layout
          e('footer', { class: "bg-slate-950 border-t border-slate-800 px-6 py-12 text-xs text-slate-500" },
            e('div', { class: "max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-8" },
              e('div', null,
                e('div', { class: "flex items-center space-x-2 text-white font-bold text-sm mb-2" },
                  e('span', { class: "bg-blue-600 text-white px-1.5 py-0.5 rounded text-xs" }, SITE_CONFIG.abbreviation),
                  e('span', null, SITE_CONFIG.companyName)
                ),
                e('p', { class: "max-w-sm mb-2" }, SITE_CONFIG.footer.tagline),
                e('p', null, `\u00A9 ${new Date().getFullYear()} ${SITE_CONFIG.companyName} Legal Video Services. All rights reserved.`)
              ),
              e('div', { class: "flex flex-col sm:flex-row gap-8 sm:gap-16 text-slate-400" },
                e('div', null,
                  e('h4', { class: "font-bold text-white uppercase tracking-wider mb-2 text-[10px]" }, "Operations Desk"),
                  e('p', null, SITE_CONFIG.footer.address),
                  e('p', null, `PH: ${SITE_CONFIG.footer.phone}`),
                  e('p', null, `EM: ${SITE_CONFIG.footer.email}`)
                ),
                e('div', null,
                  e('h4', { class: "font-bold text-white uppercase tracking-wider mb-2 text-[10px]" }, "Security Framework"),
                  e('p', null, "AES-256 Cloud Encryption"),
                  e('p', null, "HIPAA & CJIS Compliant Archiving"),
                  e('p', null, "Secured Physical Chain of Custody")
                )
              )
            )
          )
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(App));
    </script>
  </body>
</html>
