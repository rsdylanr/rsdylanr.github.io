<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox — Advanced Web Tools</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "acorn": "https://cdn.jsdelivr.net/npm/acorn@8.12.1/+esm",
    "terser": "https://cdn.jsdelivr.net/npm/terser@5.31.0/+esm",
    "diff": "https://cdn.jsdelivr.net/npm/diff@5.2.0/+esm",
    "yaml": "https://cdn.jsdelivr.net/npm/yaml@2.4.5/+esm",
    "qrcode": "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">🧰 Toolbox</div>
    <input id="search" type="search" placeholder="Search tools…">
    <nav id="tool-list"></nav>
    <div class="sidebar-footer">
      <button id="theme-toggle">🌓 Theme</button>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="menu-toggle">☰</button>
        <div><h1 id="tool-title">Loading…</h1><p id="tool-desc"></p></div>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
