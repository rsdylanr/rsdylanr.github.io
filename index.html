<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toolforge // Domain Synthesis &amp; Developer Utilities</title>
<meta name="description" content="HYPERGEN infrastructure domain &amp; fake company synthesis engine, plus 10 developer utilities. 100% client-side.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<style>
/* ============================================================
   RESET + THEME
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04060a; --bg2:#070c12; --panel:#0a0f16; --panel2:#0d141d;
  --line:#16222f; --line2:#1f2f40;
  --txt:#b9cbdd; --txt-strong:#eaf6ff; --dim:#5d7286;
  --mint:#00e6a0; --cyan:#22b8ff; --amber:#ffb020;
  --red:#ff4d6d; --violet:#a06bff; --pink:#ff6bcb;
  --radius:12px; --radius-lg:16px;
  --shadow:0 18px 50px -22px #000;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
[data-theme="light"]{
  --bg:#f2f5f9; --bg2:#ffffff; --panel:#ffffff; --panel2:#f7f9fc;
  --line:#dde3ec; --line2:#c8d2e0;
  --txt:#3a4a5c; --txt-strong:#0a1520; --dim:#7a8ba0;
  --mint:#00a878; --cyan:#0088cc; --amber:#c47a00;
  --red:#d92040; --violet:#6f3fd0; --pink:#c43a92;
  --shadow:0 8px 28px -18px rgba(0,30,60,.25);
}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(11,26,36,.9) 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(19,16,51,.75) 0%, transparent 55%),
    var(--bg);
  color:var(--txt);
  font:13px/1.5 var(--mono);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:grid;
  grid-template-columns:250px minmax(0,1fr);
  grid-template-rows:auto 1fr;
}
[data-theme="light"] body{
  background:
    radial-gradient(900px 500px at 15% -10%, #e6f5f0 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #eee9fb 0%, transparent 55%),
    var(--bg);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(34,184,255,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(34,184,255,.03) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 85%);
}

/* ============================================================
   HEADER
   ============================================================ */
header{
  grid-column:1/-1;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 18px;
  background:linear-gradient(180deg,rgba(13,20,29,.95),rgba(8,12,18,.85));
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(8px);
}
[data-theme="light"] header{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(248,250,252,.92))}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;text-decoration:none;color:inherit}
.glyph{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:conic-gradient(from 210deg,var(--mint),var(--cyan),var(--violet),var(--mint));
  box-shadow:0 0 22px -4px var(--mint);
  display:grid;place-items:center;color:#04060a;font-weight:900;font-size:15px;
}
.logo h1{font-size:15px;letter-spacing:.18em;font-weight:800;color:var(--txt-strong)}
.logo h1 span{color:var(--mint)}
.logo .sub{font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim);
  background:var(--bg2);
}
.pill b{color:var(--mint);font-weight:700}
.icon-btn{
  font:inherit;font-size:16px;line-height:1;width:38px;height:38px;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line);border-radius:10px;
  background:var(--bg2);color:var(--txt);transition:.15s;
}
.icon-btn:hover{border-color:var(--mint);color:var(--mint);transform:translateY(-1px)}

/* ============================================================
   SIDEBAR
   ============================================================ */
aside.sidebar{
  grid-row:2;
  padding:16px 12px 40px;
  border-right:1px solid var(--line);
  overflow-y:auto;
  background:rgba(8,12,18,.4);
  max-height:calc(100vh - 60px);
  position:sticky;top:60px;
}
[data-theme="light"] aside.sidebar{background:rgba(255,255,255,.5)}
.side-h{
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  padding:0 10px 8px;
}
.tool-link{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:9px;cursor:pointer;
  color:var(--txt);text-decoration:none;font-size:12px;
  transition:.14s;border:1px solid transparent;margin-bottom:2px;
}
.tool-link:hover{background:rgba(34,184,255,.06);border-color:var(--line)}
.tool-link.on{background:rgba(0,230,160,.08);border-color:rgba(0,230,160,.3);color:var(--mint)}
.tool-link .ic{width:18px;text-align:center;font-size:14px;flex:none}
.tool-link .nm{flex:1;letter-spacing:.02em}
.tool-link .star{color:var(--amber);font-size:10px}
.side-sep{height:1px;background:var(--line);margin:12px 6px}

/* ============================================================
   MAIN
   ============================================================ */
main{
  grid-row:2;
  padding:20px 22px 60px;
  position:relative;z-index:1;
  min-width:0;
}
.tool-head{margin-bottom:18px}
.tool-head h2{
  font-size:22px;letter-spacing:-.01em;color:var(--txt-strong);font-weight:800;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.tool-head h2 .badge{
  font-size:9px;letter-spacing:.18em;padding:3px 8px;border-radius:999px;
  background:rgba(0,230,160,.12);color:var(--mint);border:1px solid rgba(0,230,160,.3);
  font-weight:700;text-transform:uppercase;
}
.tool-head p{margin-top:6px;font-size:12px;color:var(--dim);max-width:720px}

/* ============================================================
   PANELS
   ============================================================ */
.panel{
  background:linear-gradient(180deg,rgba(13,20,29,.92),rgba(8,12,18,.92));
  border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}
[data-theme="light"] .panel{background:linear-gradient(180deg,#fff,#fafcff)}
.panel-h{
  display:flex;align-items:center;gap:9px;
  padding:11px 14px;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);flex:none}
.panel-b{padding:14px}

/* ============================================================
   FORM CONTROLS
   ============================================================ */
fieldset{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:12px;background:var(--bg2)}
legend{
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);
  padding:0 7px;margin-left:2px;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row.one{grid-template-columns:1fr}
.row.three{grid-template-columns:1fr 1fr 1fr}
.f{margin-bottom:9px}
.f:last-child{margin-bottom:0}
label.lab{display:block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
input[type=text],input[type=number],input[type=search],select,textarea{
  width:100%;font:inherit;font-size:12px;color:var(--txt-strong);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;outline:none;transition:.15s;
}
textarea{resize:vertical;min-height:56px;line-height:1.45;font-family:var(--mono)}
input:focus,select:focus,textarea:focus{
  border-color:var(--mint);box-shadow:0 0 0 3px rgba(0,230,160,.1);background:var(--bg2);
}
select{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px;
}
select option{background:var(--bg);color:var(--txt-strong)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:5px 0}
.check input{
  appearance:none;width:16px;height:16px;flex:none;border:1px solid var(--line);
  border-radius:5px;background:var(--bg);cursor:pointer;position:relative;transition:.15s;
}
.check input:checked{background:var(--mint);border-color:var(--mint)}
.check input:checked::after{
  content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;
  border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg);
}
.check span{font-size:11px;color:var(--txt);letter-spacing:.03em}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:9px 14px;border-radius:9px;cursor:pointer;border:1px solid var(--line);
  background:var(--bg2);color:var(--txt);transition:.15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
}
.btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 18px -8px var(--cyan)}
.btn:active{transform:translateY(1px)}
.btn.primary{
  background:linear-gradient(180deg,var(--mint),#00b47e);color:#02120c;border-color:var(--mint);
  box-shadow:0 0 24px -8px var(--mint);font-weight:900;
}
[data-theme="light"] .btn.primary{color:#fff}
.btn.primary:hover{box-shadow:0 0 32px -6px var(--mint);color:#02120c}
[data-theme="light"] .btn.primary:hover{color:#fff}
.btn.wide{width:100%}
.btn.tiny{font-size:10px;padding:4px 9px;border-radius:6px;letter-spacing:.08em}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================
   HYPERGEN LAYOUT
   ============================================================ */
.hg-grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1080px){.hg-grid{grid-template-columns:1fr}}

.controls .panel-b{
  max-height:calc(100vh - 200px);overflow-y:auto;padding-right:10px;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
}
.controls .panel-b::-webkit-scrollbar{width:8px}
.controls .panel-b::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.controls .panel-b::-webkit-scrollbar-track{background:transparent}

/* FQDN display */
.out-main{
  padding:18px 20px;border-bottom:1px solid var(--line);
  background:radial-gradient(700px 200px at 0% 0%,rgba(0,230,160,.06),transparent 70%);
}
.fqdn{
  font-size:clamp(14px,1.9vw,24px);font-weight:700;letter-spacing:.01em;
  color:var(--txt-strong);word-break:break-all;line-height:1.35;min-height:1.4em;
  text-shadow:0 0 30px rgba(0,230,160,.2);
}
.fqdn .root{color:var(--mint)}
.fqdn .tld{color:var(--cyan)}
.fqdn .sec{color:var(--amber)}
.fqdn .tenant{color:var(--violet)}
.fqdn .env{color:var(--pink)}
.fqdn .region{color:var(--amber)}
.fqdn .sep{color:var(--dim);opacity:.5}
.labels-bar{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.label-chip{
  font-size:10px;padding:3px 8px;border-radius:6px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  letter-spacing:.04em;transition:.14s;
}
.label-chip:hover{border-color:var(--mint);color:var(--mint)}

/* Stats */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stat{
  border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--bg2);min-width:74px;
}
.stat .k{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:13px;font-weight:700;color:var(--txt-strong);margin-top:2px}
.stat .v.ok{color:var(--mint)} .stat .v.bad{color:var(--red)} .stat .v.warn{color:var(--amber)}

.score-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:12px}
[data-theme="light"] .score-bar{background:rgba(0,0,0,.06)}
.score-fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--amber),var(--mint));transition:width .35s ease}

.issues{margin-top:10px;font-size:11px;color:var(--red);display:flex;flex-direction:column;gap:3px}
.issues .okmsg{color:var(--mint)}
.issues .warnmsg{color:var(--amber)}

/* Tabs */
.tabs-wrap{
  border-bottom:1px solid var(--line);background:var(--bg2);
  overflow-x:auto;scrollbar-width:none;
}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:4px;padding:9px 12px;min-width:max-content}
.tab{
  font:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
  padding:6px 10px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--dim);
  white-space:nowrap;
}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--bg);border-color:var(--line);color:var(--mint)}
.tab.group{color:var(--dim);cursor:default;border-color:transparent;padding:6px 4px;font-weight:700}
.tab.group:hover{color:var(--dim)}

/* Output pre */
pre.out{
  margin:0;padding:16px;font:inherit;font-size:12px;line-height:1.65;
  color:var(--txt-strong);white-space:pre-wrap;word-break:break-word;
  max-height:520px;overflow:auto;background:var(--bg);
  scrollbar-width:thin;scrollbar-color:var(--line2) var(--bg);
}
pre.out::-webkit-scrollbar{width:9px;height:9px}
pre.out::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
pre.out::-webkit-scrollbar-track{background:var(--bg)}

/* Footer bar */
.footbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);align-items:center;background:var(--bg2)}
.footbar .spacer{flex:1}
.hint{font-size:10px;color:var(--dim);letter-spacing:.05em}

/* Availability / WHOIS panel */
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.meta-card{
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg2);
}
.meta-card h4{
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  margin-bottom:7px;font-weight:700;
}
.meta-card .val{font-size:12px;color:var(--txt-strong);word-break:break-word}
.meta-card .val.ok{color:var(--mint)} .meta-card .val.bad{color:var(--red)}
.meta-card .val.warn{color:var(--amber)}

/* Domain tree */
.tree{font-size:12px;line-height:1.9;color:var(--txt);font-family:var(--mono)}
.tree .node{display:inline-block;padding:1px 5px;border-radius:4px}
.tree .node.leaf{color:var(--mint)}
.tree .branch{color:var(--dim)}

/* History list */
.hist-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.hist-item{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  font-size:11px;cursor:pointer;transition:.14s;
}
.hist-item:hover{border-color:var(--mint)}
.hist-item .fq{flex:1;color:var(--txt-strong);word-break:break-all}
.hist-item .ts{color:var(--dim);font-size:9.5px;letter-spacing:.05em}
.hist-item .actions{display:flex;gap:4px}

/* ============================================================
   OTHER TOOLS
   ============================================================ */
.tool-body{max-width:900px}
.tool-body .panel{margin-bottom:16px}
.tool-body textarea{width:100%}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin:14px 0}
.mini-stat{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.mini-stat .k{font-size:10px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.mini-stat .v{font-size:18px;font-weight:700;color:var(--txt-strong);margin-top:2px;letter-spacing:-.01em}

.msg{font-size:12px;margin-top:9px;min-height:18px}
.msg.err{color:var(--red)} .msg.ok{color:var(--mint)}

.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.swatch{
  width:58px;height:58px;border-radius:10px;border:1px solid var(--line);
  cursor:pointer;position:relative;transition:.12s;
}
.swatch:hover{transform:scale(1.06)}
.swatch small{
  position:absolute;inset:auto 0 3px 0;text-align:center;
  font-size:9px;font-family:var(--mono);color:#fff;text-shadow:0 0 3px rgba(0,0,0,.8);
}

.meter{height:7px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;width:0;transition:width .25s,background .25s}

input[type=range]{accent-color:var(--mint);width:100%}
input[type=color]{width:60px;height:44px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);cursor:pointer}

.hash-row{margin-bottom:12px}
.hash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.hash-head span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.hash-val{
  display:block;font-size:11.5px;word-break:break-all;padding:9px 11px;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;
  font-family:var(--mono);color:var(--txt-strong);
}

/* ============================================================
   TOAST
   ============================================================ */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);
  background:var(--mint);color:#02120c;font-weight:800;font-size:11.5px;letter-spacing:.1em;
  padding:11px 20px;border-radius:10px;opacity:0;transition:.28s;pointer-events:none;z-index:99;
  text-transform:uppercase;box-shadow:0 14px 40px -10px var(--mint);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  aside.sidebar{
    grid-row:auto;position:static;max-height:none;border-right:0;
    border-bottom:1px solid var(--line);padding:10px 8px;
    display:flex;gap:6px;overflow-x:auto;
  }
  aside.sidebar .side-h{display:none}
  aside.sidebar .side-sep{display:none}
  .tool-link{white-space:nowrap;padding:7px 11px;margin:0}
  .tool-link .nm{display:none}
  .tool-link .ic{font-size:16px}
  .tool-link.on .nm{display:inline}
  .hdr-right .pill{display:none}
}
@media(max-width:520px){
  main{padding:14px 12px 40px}
  .logo .sub{display:none}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="#/hypergen">
    <div class="glyph">◈</div>
    <div>
      <h1>TOOL<span>FORGE</span></h1>
      <div class="sub">Domain synthesis &amp; developer utilities</div>
    </div>
  </a>
  <div class="hdr-right">
    <div class="pill">client-side · <b>zero network</b></div>
    <div class="pill">deterministic <b>seed prng</b></div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme (T)" aria-label="Toggle theme">🌙</button>
  </div>
</header>

<aside class="sidebar">
  <div class="side-h">Tools</div>
  <nav id="toolNav"></nav>
</aside>

<main id="main"></main>

<div class="toast" id="toast">Copied</div>

<script>
"use strict";
/* ============================================================
   GLOBAL HELPERS
   ============================================================ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function slug(s){
  const out = String(s).toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .replace(/-{2,}/g,"-")
    .slice(0,60);
  return out || "x";
}
function cap(s){ return String(s).charAt(0).toUpperCase() + String(s).slice(1); }
function pad2(n){ return String(n).padStart(2,"0"); }

let toastTimer;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1700);
}

async function copy(text, label="Copied to clipboard"){
  if(!text){ toast("Nothing to copy"); return; }
  try{
    await navigator.clipboard.writeText(text);
    toast(label);
  }catch{
    const ta = document.createElement("textarea");

/* ---------- Deterministic PRNG ---------- */
function hashStr(s){
  let h = 2166136261 >>> 0;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeRng(seed){
  const next = mulberry32(hashStr(String(seed)));
  return {
    next,
    int:(min,max)=>Math.floor(next()*(max-min+1))+min,
    pick:arr=>arr[Math.floor(next()*arr.length)],
    chance:p=>next()<p,
    hex:n=>{let s="";for(let i=0;i<n;i++)s+="0123456789abcdef"[Math.floor(next()*16)];return s;}
  };
}

/* ---------- YAML serializer ---------- */
function toYaml(o, indent=0){
  const pad = "  ".repeat(indent);
  return Object.entries(o).map(([k,v])=>{
    if(v === null || v === undefined) return pad + k + ": null";
    if(Array.isArray(v)){
      if(!v.length) return pad + k + ": []";
      return pad + k + ":\n" + v.map(x =>
        pad + "  - " + (typeof x === "object" ? JSON.stringify(x) : x)).join("\n");
    }
    if(typeof v === "object") return pad + k + ":\n" + toYaml(v, indent+1);
    if(typeof v === "number" || typeof v === "boolean") return pad + k + ": " + v;
    return pad + k + ": " + JSON.stringify(v);
  }).join("\n");
}

  /* ---------- Fake company generator (multi-algorithm) ---------- */
  function generateFakeCompany(p, rng){
    const pool = FAKE_COMPANY[p.industry] || FAKE_COMPANY.tech;
    const typeSuffixes = COMPANY_TYPES[p.companyType] || COMPANY_TYPES.enterprise;
    const alg = p.nameAlgo || "wordbank";

    const R = () => cap(rng.pick(pool.roots));
    const M = () => cap(rng.pick(pool.modifiers));
    const S = () => cap(rng.pick(pool.suffixes));
    const T = () => cap(rng.pick(typeSuffixes));

    if(alg === "phonetic"){
      const syl = rng.pick(SYLL_A) + rng.pick(SYLL_B) + (rng.chance(.5) ? rng.pick(SYLL_C) : "");
      return cap(syl);
    }
    if(alg === "portmanteau"){
      const a = rng.pick(pool.roots);
      const b = rng.pick(pool.roots);
      const cutA = a.slice(0, Math.max(2, Math.ceil(a.length/2)));
      const cutB = b.slice(Math.max(1, Math.floor(b.length/2)));
      return cap(cutA + cutB);
    }
    if(alg === "latin"){
      const roots = ["nova","veritas","aurea","prima","lumen","fortis","arcana","orbis","terra","aquila","corvus","lupus","draco","phoenix","solum","caelum"];
      const suffixes = ["ia","um","us","is","ora","ana","ia","ium"];
      return cap(rng.pick(roots) + rng.pick(suffixes));
    }
    if(alg === "acronym"){
      const words = [R(), M(), R()];
      return words.map(w => w[0]).join("").toUpperCase() + (rng.chance(.5) ? T().slice(0,2).toUpperCase() : "");
    }

    /* wordbank (default) */
    switch(rng.int(0,5)){
      case 0: return R() + S();
      case 1: return M() + R();
      case 2: return M() + R() + S();
      case 3: return R() + R();
      case 4: return R() + T();
      default:return M() + T();
    }
  }

  /* ---------- Brandability scoring for company names ---------- */
  function brandabilityScore(name){
    let s = 60;
    const notes = [];
    const len = name.length;
    if(len >= 5 && len <= 11){ s += 15; notes.push("optimal length"); }
    else if(len < 5){ s += 4; notes.push("very short"); }
    else if(len > 15){ s -= 12; notes.push("long name"); }

    const vowels = (name.match(/[aeiou]/gi) || []).length;
    const ratio = vowels / Math.max(1, len);
    if(ratio > 0.25 && ratio < 0.55){ s += 10; notes.push("good vowel ratio"); }
    else { s -= 5; }

    if(/\d/.test(name)){ s -= 10; notes.push("contains digits"); }
    if(/-/.test(name)){ s -= 4; }
    if(/^[A-Z][a-z]+$/.test(name)){ s += 6; notes.push("clean capitalization"); }
    if(/(.)\1/.test(name.toLowerCase())){ s -= 3; notes.push("repeated chars"); }

    const brandableEndings = /(ly|ify|io|er|ora|ana|ify|eo|ia)$/i;
    if(brandableEndings.test(name)){ s += 8; notes.push("brandable ending"); }

    s = Math.max(5, Math.min(99, Math.round(s)));
    return {score:s, notes};
  }

  /* ---------- Realism scoring for FQDNs ---------- */
  function realismScore(rec, p){
    let s = 88;
    const notes = [];
    if(rec.environment === "prod" && rec.label_count <= 3){ s += 5; notes.push("lean prod naming"); }
    if(rec.environment !== "prod") s += 2;
    if(rec.region){ s += 4; notes.push("region-qualified"); }
    if(rec.token){ s -= 9; notes.push("random token"); }
    if(rec.label_count > 4){ s -= 8; notes.push("deep nesting"); }
    if(rec.fqdn.length > 70){ s -= 6; notes.push("long FQDN"); }
    if(rec.compliance && rec.environment !== "prod"){ s -= 7; notes.push("compliance outside prod"); }
    if(rec.security === "zero-trust" && rec.environment === "dev"){ s -= 5; notes.push("ZT in dev"); }
    if(p.joinStyle === "flat" && rec.label_count === 1) s += 3;
    if(rec.tenant && p.companyType === "saas"){ s += 6; notes.push("tenant-isolated SaaS"); }
    if(rec.tenant && p.companyType !== "saas" && p.tenantMode === "random") s -= 4;
    if(rec.validation.valid) s += 3; else s -= 40;
    return {score:Math.max(4, Math.min(99, Math.round(s))), notes};
  }

  function validateFqdn(fqdn){

    fqdn.split(".").forEach(l => {
      if(!l.length) errors.push("Empty label detected");
      else if(l.length > 63) errors.push('Label "' + l + '" exceeds 63 characters');
      else if(!/^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(l))
        errors.push('Label "' + l + '" violates RFC 1123');
    });
    return {valid:errors.length === 0, errors};
  }

  function synthIp(rng, env){
    const r = rng.next();
    if(env === "prod" && r < 0.45) return "10." + rng.int(0,255) + "." + rng.int(0,255) + "." + rng.int(1,254);
    if(r < 0.75) return "172." + rng.int(16,31) + "." + rng.int(0,255) + "." + rng.int(1,254);
    return "192.168." + rng.int(0,255) + "." + rng.int(1,254);
  }

  /* ---------- Mock availability (deterministic) ---------- */
  function mockAvailability(fqdn){
    const h = hashStr(fqdn);
    const r = (h % 1000) / 1000;
    const available = r > 0.35;
    const registrar = ["Namecheap","Cloudflare","GoDaddy","Gandi","Porkbun","Google Domains","Hover","Route53"][h % 8];
    const expiry = 2027 + (h % 6);
    const price = (8 + (h % 1200)/100).toFixed(2);
    return {available, registrar, expiry, price};
  }

  /* ---------- WHOIS mock ---------- */
  function mockWhois(fqdn, p){
    const h = hashStr(fqdn);
    const orgs = ["Privacy Protect LLC","Domains By Proxy","WhoisGuard Inc.","Perfect Privacy","Contact Privacy Inc."];
    const created = 2016 + (h % 9);
    return {
      Registrar:h ? ["Namecheap","Cloudflare","GoDaddy","Gandi","Porkbun"][h % 5] : "—",
      "Registrant Org":orgs[h % 5],
      Created:created + "-" + pad2((h % 12) + 1) + "-" + pad2((h % 27) + 1),
      Updated:created + 2 + "-" + pad2((h % 12) + 1) + "-" + pad2((h % 27) + 1),
      "Expiry":(created + 5) + "-" + pad2((h % 12) + 1) + "-" + pad2((h % 27) + 1),
      "Name Servers":"ns1." + (p.company || "acme") + "." + (COUNTRIES[p.country] || COUNTRIES.global).cctld,
      DNSSEC:h % 3 === 0 ? "signedDelegation" : "unsigned",
      Status:"clientTransferProhibited"
    };
  }

  /* ---------- Core generator ---------- */
  function generateOne(p, seedStr, companyOverride){
    const rng = makeRng(seedStr);
    const country = COUNTRIES[p.country] || COUNTRIES.global;
    const tld = resolveTld(p, country, rng);
    const companyDisplay = companyOverride || p.company || "acme";
    const root = slug(companyDisplay);

    const secMap = {none:"", hardened:"sec", "zero-trust":"zt", vpn:"vpn"};
    const secPrefix = secMap[p.security] || "";

    const svcDef = SERVICES[p.service] || SERVICES.api;
    let svcLabel;
    if(p.serviceName){
      const n = slug(p.serviceName);
      svcLabel = p.combinePrefix ? (rng.pick(svcDef.prefixes) + "-" + n) : n;
    } else {
      svcLabel = rng.pick(svcDef.prefixes);
    }
    if(secPrefix && p.securityStyle === "prefix") svcLabel = secPrefix + "-" + svcLabel;

    if(p.instanceMode === "number")      svcLabel += "-" + String(rng.int(1,9)).padStart(2,"0");
    else if(p.instanceMode === "letter") svcLabel += "-" + rng.pick(["a","b","c","d","e"]);
    else if(p.instanceMode === "node")   svcLabel += "-node" + rng.int(1,12);
    else if(p.instanceMode === "shard")  svcLabel += "-s" + rng.int(1,16);

    let token = null;
    if(p.token){ token = rng.hex(p.tokenLen); svcLabel += "-" + token; }

    const parts = {service:svcLabel};
    if(secPrefix && p.securityStyle === "label") parts.security = secPrefix;
    if(p.compliance !== "none") parts.compliance = p.compliance;

    if(p.tenantMode === "fixed" && p.tenantName)  parts.tenant = slug(p.tenantName);
    else if(p.tenantMode === "random")            parts.tenant = rng.pick(TENANTS);
    else if(p.tenantMode === "internal")          parts.tenant = "int";

    let region = "";
    if(p.region === "auto")        region = rng.pick(REGIONS[p.regionSet] || REGIONS.aws);
    else if(p.region !== "none")   region = p.region;
    if(region && p.regionShort)    region = shortRegion(region);
    if(region)                     parts.region = region;

    let envKey = (p.env === "auto") ? rng.pick(["prod","staging","dev","qa"]) : p.env;
    const envDef = ENVS[envKey] || ENVS.prod;
    const envLabel = p.envVariance ? rng.pick([envDef.label].concat(envDef.aliases)) : envDef.label;
    parts.env = envLabel;

    const CONVENTIONS = {
      cloud:      ["tenant","compliance","security","service","region","env"],
      k8s:        ["tenant","compliance","security","service","env","region"],
      enterprise: ["tenant","compliance","security","env","region","service"],
      legacy:     ["tenant","security","service","env"],
      minimal:    ["service","env","region"],
      flat:       ["service","env","region"]
    };
    const PRIORITY = {service:0, env:1, tenant:2, region:3, security:4, compliance:5};
    const order = CONVENTIONS[p.convention] || CONVENTIONS.cloud;
    let labels = order.map(k => parts[k]).filter(Boolean);

    const active = Object.assign({}, parts);
    let guard = 0;
    while(labels.length > p.maxLabels && guard++ < 12){
      let worst = null, worstP = -1;
      for(const k of Object.keys(active)){
        if(!active[k]) continue;
        if(!labels.includes(active[k])) continue;
        const pr = (PRIORITY[k] === undefined) ? 99 : PRIORITY[k];
        if(pr > worstP){ worstP = pr; worst = k; }
      }
      if(worst === null) break;
      labels = labels.filter(l => l !== active[worst]);
      active[worst] = null;
    }

    let joinStyle = p.joinStyle;
    if(joinStyle === "flat") labels = [labels.join("-")];
    else if(joinStyle === "mixed" && labels.length > 2){
      const tail = labels.slice(-2);
      const head = labels.slice(0,-2).join("-");
      labels = [head].concat(tail);
    }

    const fqdn = labels.concat([root, tld]).join(".");
    const port = rng.pick(svcDef.ports);
    const path = p.path || "";
    const ip = synthIp(rng, envKey);

    const rec = {
      fqdn,
      company:companyDisplay,
      root_domain:root + "." + tld,
      labels,
      tld,
      service:p.service,
      service_label:svcLabel,
      service_name:p.serviceName ? slug(p.serviceName) : null,
      environment:envKey,
      environment_label:envLabel,
      region:region || null,
      region_short:region ? shortRegion(region) : null,
      tenant:active.tenant || null,
      security:p.security,
      security_prefix:secPrefix || null,
      compliance:p.compliance === "none" ? null : p.compliance,
      instance:p.instanceMode === "none" ? null : p.instanceMode,
      token,
      scheme:svcDef.scheme,
      port,
      ip,
      url:svcDef.scheme + "://" + fqdn + ":" + port + path,
      label_count:labels.length,
      char_count:fqdn.length,
      generated_at:new Date().toISOString()
    };

    rec.validation = validateFqdn(fqdn);
    rec.score = realismScore(rec, p);
    rec.brand = brandabilityScore(companyDisplay);
    rec.availability = mockAvailability(fqdn);
    rec.whois = mockWhois(fqdn, p);
    return rec;
  }

  /* ---------- Output formatters ---------- */
  function formatRecord(rec, fmt){
    switch(fmt){
      case "fqdn": return rec.fqdn;
      case "company": return rec.company + " — " + rec.fqdn;
      case "url": return rec.url;
      case "email": return "noreply@" + rec.fqdn;
      case "hosts": return rec.ip + "\t" + rec.fqdn;
      case "bind": return rec.fqdn + ".\t3600\tIN\tA\t" + rec.ip;
      case "cloudflare": return rec.fqdn + "  A  " + rec.ip + "  (proxied=false)";
      case "route53": return '{"Name":"' + rec.fqdn + '.","Type":"A","TTL":300,"ResourceRecords":[{"Value":"' + rec.ip + '"}]}';
      case "nginx":
        return 'server {\n  listen 443 ssl http2;\n  server_name ' + rec.fqdn + ';\n' +
               '  ssl_certificate     /etc/ssl/' + rec.fqdn + '.crt;\n' +
               '  ssl_certificate_key /etc/ssl/' + rec.fqdn + '.key;\n' +
               '  location ' + (rec.url.split("/").slice(3).join("/") || "/") + ' {\n' +
               '    proxy_pass http://127.0.0.1:' + rec.port + ';\n  }\n}';
      case "caddy":
        return rec.fqdn + ' {\n  reverse_proxy 127.0.0.1:' + rec.port + '\n  tls internal\n}';
      case "traefik":
        return 'traefik.http.routers.' + slug(rec.fqdn) + '.rule=Host(`' + rec.fqdn + '`)\n' +
               'traefik.http.routers.' + slug(rec.fqdn) + '.entrypoints=websecure\n' +
               'traefik.http.routers.' + slug(rec.fqdn) + '.tls=true\n' +
               'traefik.http.services.' + slug(rec.fqdn) + '.loadbalancer.server.port=' + rec.port;
      case "k8s":
        return 'apiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: ' + slug(rec.fqdn) + '\n' +
               'spec:\n  tls:\n    - hosts: [' + rec.fqdn + ']\n      secretName: ' + slug(rec.fqdn) + '-tls\n' +
               '  rules:\n    - host: ' + rec.fqdn + '\n      http:\n        paths:\n' +
               '          - path: /\n            pathType: Prefix\n            backend:\n              service:\n' +
               '                name: ' + slug(rec.service_label) + '\n                port:\n                  number: ' + rec.port;
      case "docker-compose":
        return 'services:\n  ' + slug(rec.service_label) + ':\n    image: registry.local/' + slug(rec.service_label) + ':latest\n' +
               '    hostname: ' + rec.fqdn + '\n    ports:\n      - "' + rec.port + ':' + rec.port + '"\n' +
               '    networks:\n      - app-net\n    labels:\n      - "traefik.enable=true"\n      - "traefik.http.routers.' + slug(rec.fqdn) + '.rule=Host(`' + rec.fqdn + '`)"';
      case "docker-labels":
        return "traefik.enable=true\n" +
               "traefik.http.routers." + slug(rec.fqdn) + ".rule=Host(`" + rec.fqdn + "`)\n" +
               "traefik.http.routers." + slug(rec.fqdn) + ".entrypoints=websecure\n" +
               "traefik.http.routers." + slug(rec.fqdn) + ".tls.certresolver=letsencrypt\n" +
               "traefik.http.services." + slug(rec.fqdn) + ".loadbalancer.server.port=" + rec.port;
      case "ansible":
        return "[web]\n" + rec.fqdn + " ansible_host=" + rec.ip + " ansible_port=" + rec.port;
      case "systemd":
        return '[Unit]\nDescription=' + rec.fqdn + ' service\nAfter=network.target\n\n' +
               '[Service]\nExecStart=/usr/local/bin/' + slug(rec.service_label) + '\n' +
               'Restart=always\nEnvironment=ENV=' + rec.environment + '\n\n[Install]\nWantedBy=multi-user.target';
      case "postgres":
        return "postgres://app:" + rec.token + "@" + rec.fqdn + ":" + rec.port + "/appdb?sslmode=require";
      case "redis":
        return "redis://:" + (rec.token || "secret") + "@" + rec.fqdn + ":" + rec.port + "/0";
      case "env":
        return "SERVICE_HOST=" + rec.fqdn + "\nSERVICE_PORT=" + rec.port + "\nSERVICE_SCHEME=" + rec.scheme +
               "\nENVIRONMENT=" + rec.environment + "\nREGION=" + (rec.region || "") +
               "\nCOMPLIANCE=" + (rec.compliance || "none") +
               "\nTOKEN=" + (rec.token || "");
      case "certs":
        return "SAN list for " + rec.fqdn + ":\n  DNS:" + rec.fqdn +
               "\n  DNS:*." + rec.fqdn +
               "\n  DNS:" + rec.root_domain +
               "\n  DNS:*." + rec.root_domain;
      case "json": return JSON.stringify(rec, null, 2);
      case "yaml": return toYaml(rec);
      case "csv":
        return [rec.company, rec.fqdn, rec.environment, rec.region || "", rec.service,
                rec.security, rec.compliance || "", rec.ip, rec.port].join(",");
      case "terraform":
        return '"' + slug(rec.service_label) + '" = {\n' +
               '  company     = "' + rec.company + '"\n' +
               '  fqdn        = "' + rec.fqdn + '"\n' +
               '  environment = "' + rec.environment + '"\n' +
               '  ip          = "' + rec.ip + '"\n' +
               '  port        = ' + rec.port + '\n}';
      default: return rec.fqdn;
    }
  }

  function formatCollection(records, fmt){
    if(fmt === "json") return JSON.stringify(records, null, 2);
    if(fmt === "yaml") return records.map(r => toYaml(r)).join("\n---\n");
    if(fmt === "csv"){
      const head = "company,fqdn,environment,region,service,security,compliance,ip,port";
      return head + "\n" + records.map(r => formatRecord(r, "csv")).join("\n");
    }
    return records.map(r => formatRecord(r, fmt)).join("\n\n");
  }

    /* --- build records --- */
    function buildRecords(p){
      const records = [];
      if(p.mode === "single"){
        records.push(generateOne(p, p.seed));
      } else if(p.mode === "bulk"){
        for(let i=0;i<p.count;i++) records.push(generateOne(p, p.seed + "::" + i));
      } else if(p.mode === "fake"){
        const used = new Set();
        let guard = 0;
        while(records.length < p.count && guard++ < p.count * 30){
          const rng = makeRng(p.seed + "::fake::" + guard);
          const name = generateFakeCompany(p, rng);
          const key = name.toLowerCase();
          if(used.has(key)) continue;
          used.add(key);
          records.push(generateOne(p, p.seed + "::" + records.length, name));
        }
      } else { /* matrix */
        const envs = p.mEnvs.length ? p.mEnvs : [p.env];
        const regs = p.mRegions.length ? p.mRegions : ["none"];
        const svcs = p.mServices.length ? p.mServices : [p.service];
        let i = 0;
        envs.forEach(e => regs.forEach(r => svcs.forEach(s => {
          if(records.length >= 500) return;
          const q = Object.assign({}, p, {
            env:ENVS[e] ? e : "prod",
            region:r === "none" ? "none" : r,
            service:SERVICES[s] ? s : "api"
          });
          records.push(generateOne(q, p.seed + "::" + i));
          i++;
        })));
      }
      return records;
    }

    /* --- render --- */
    let CURRENT_FORMAT = "fqdn";
    let LAST_TEXT = "";

    const FORMAT_GROUPS = [
      ["Domain", ["fqdn","company","email","url"]],

      ["Infra", ["nginx","caddy","traefik","k8s","docker-compose","docker-labels","ansible","systemd"]],

      ["Data", ["json","yaml","csv","terraform"]]
    ];

    function buildTabs(){
      const wrap = $("#tabs");
      wrap.innerHTML = "";
      FORMAT_GROUPS.forEach(([group, fmts], gi) => {
        if(gi > 0){
          const g = document.createElement("span");
          g.className = "tab group";
          g.textContent = "·";
          wrap.appendChild(g);
        }
        fmts.forEach(f => {
          const b = document.createElement("button");
          b.className = "tab" + (f === CURRENT_FORMAT ? " on" : "");
          b.textContent = f;
          b.addEventListener("click", () => { CURRENT_FORMAT = f; buildTabs(); paintOutput(); });
          wrap.appendChild(b);
        });
      });
    }

    function paintOutput(){
      if(!state.records.length) return;
      let text;
      if(["json","yaml","csv"].includes(CURRENT_FORMAT)){
        text = formatCollection(state.records, CURRENT_FORMAT);
      } else {
        text = state.records.map(r => {
          if(CURRENT_FORMAT === "url" && !state.params.showPort){
            return r.scheme + "://" + r.fqdn + (state.params.path || "");
          }
          return formatRecord(r, CURRENT_FORMAT);
        }).join("\n\n");
      }
      LAST_TEXT = text;
      $("#out").textContent = text;
      const avg = Math.round(state.records.reduce((a,r)=>a+r.score.score,0)/state.records.length);
      $("#hint").textContent = state.records.length + " record(s) · " + CURRENT_FORMAT + " · seed: " + state.params.seed + " · score " + avg + "/100";
    }

    function stat(k,v,cls){
      return '<div class="stat"><div class="k">' + k + '</div><div class="v ' + (cls||'') + '">' + escapeHtml(String(v)) + '</div></div>';
    }

    function paintHeadline(){
      const p = state.params;
      const head = state.records[0];
      const fq = $("#fqdnOut");
      if(state.records.length === 1){
        const rootParts = head.root_domain.split(".");
        const root = rootParts.slice(0, -1).join(".");
        const tld = head.tld;
        const subLabels = head.labels.slice(0, head.labels.length - 0);
        // Build subdomain display with coloring
        const colorMap = ["sec","tenant","env","region","sec"];
        let subHtml = subLabels.map((l, i) => {
          const cls = colorMap[i % colorMap.length];
          return '<span class="' + cls + '">' + escapeHtml(l) + '</span>';
        }).join('<span class="sep">.</span>');
        fq.innerHTML = subHtml +
          '<span class="sep">.</span><span class="root">' + escapeHtml(root) + '</span>' +
          '<span class="sep">.</span><span class="tld">' + escapeHtml(tld) + '</span>';
      } else {
        const noun = p.mode === "fake" ? "companies" : "domains";
        fq.innerHTML = '<span class="root">' + state.records.length + '</span> ' + noun + ' synthesized' +
          (p.mode !== "fake"
            ? '<span class="sep"> · </span><span class="tld">' + escapeHtml(head.root_domain) + '</span>'
            : '');
      }

      /* label chips */
      const chips = $("#labelsBar");
      if(state.records.length === 1){
        chips.innerHTML = head.labels.map(l =>
          '<span class="label-chip" data-copy="' + escapeHtml(l) + '">' + escapeHtml(l) + '</span>'
        ).join("");
      } else {
        chips.innerHTML = "";
      }
    }

    function paintStats(){
      const records = state.records;
      const avgScore = Math.round(records.reduce((a,r)=>a+r.score.score,0)/records.length);
      const allValid = records.every(r => r.validation.valid);
      const maxLen = Math.max(...records.map(r=>r.char_count));
      const maxLabels = Math.max(...records.map(r=>r.label_count));
      const avgBrand = Math.round(records.reduce((a,r)=>a+r.brand.score,0)/records.length);
      $("#stats").innerHTML =
        stat("domains", records.length, "") +
        stat("valid", allValid ? "RFC 1123" : "FAIL", allValid ? "ok" : "bad") +
        stat("max len", maxLen + " ch", maxLen > 253 ? "bad" : (maxLen > 100 ? "warn" : "ok")) +
        stat("labels", maxLabels, maxLabels > 5 ? "warn" : "ok") +
        stat("realism", avgScore + "%", avgScore > 80 ? "ok" : (avgScore > 60 ? "warn" : "bad")) +
        stat("brand", avgBrand + "%", avgBrand > 75 ? "ok" : (avgBrand > 55 ? "warn" : "bad"));
      $("#scoreFill").style.width = avgScore + "%";

      /* issues */
      const issues = [];
      records.forEach((r, i) => r.validation.errors.forEach(e => issues.push("[" + i + "] " + e)));
      const box = $("#issues");
      if(issues.length){
        box.innerHTML = issues.slice(0, 8).map(x => "⚠ " + escapeHtml(x)).join("<br>");
      } else {
        const note = records[0].score.notes.length
          ? "✓ " + escapeHtml(records[0].score.notes.join(" · "))
          : "✓ all labels pass RFC 1123 validation";
        box.innerHTML = '<span class="okmsg">' + note + '</span>';
      }
    }

    function paintCompanyAnalysis(){
      const el = $("#companyAnalysis");
      if(!state.records.length){ el.innerHTML = ""; return; }
      const head = state.records[0];
      const brand = head.brand;
      const nameLen = head.company.length;
      const vowels = (head.company.match(/[aeiou]/gi) || []).length;
      const cons = nameLen - vowels;
      const syll = Math.max(1, Math.round(vowels));
      const brandColor = brand.score > 75 ? "var(--mint)" : (brand.score > 55 ? "var(--amber)" : "var(--red)");
      el.innerHTML = `
        <div style="font-size:22px;font-weight:800;color:var(--txt-strong);letter-spacing:-.01em;margin-bottom:4px">${escapeHtml(head.company)}</div>
        <div style="font-size:11px;color:var(--dim);margin-bottom:12px">${escapeHtml(head.root_domain)}</div>
        <div class="meta-grid">
          <div class="meta-card"><h4>Brandability</h4><div class="val" style="color:${brandColor};font-size:20px">${brand.score}%</div></div>
          <div class="meta-card"><h4>Length</h4><div class="val">${nameLen} chars</div></div>
          <div class="meta-card"><h4>Syllables (est.)</h4><div class="val">${syll}</div></div>
          <div class="meta-card"><h4>Vowels / Consonants</h4><div class="val">${vowels} / ${cons}</div></div>
        </div>
        <div style="margin-top:12px;font-size:11px;color:var(--dim)">
          ${brand.notes.length ? "▸ " + escapeHtml(brand.notes.join(" · ")) : "▸ clean name profile"}
        </div>`;
    }

    function paintTreeAndMeta(){
      const tree = $("#treeOut");
      const meta = $("#metaGrid");
      if(!state.records.length){ tree.textContent = "—"; meta.innerHTML = ""; return; }
      const head = state.records[0];
      const parts = head.labels.concat(head.root_domain.split("."));
      let html = "";
      parts.forEach((part, i) => {
        const indent = "  ".repeat(i);
        const branch = i === parts.length - 1 ? "└─" : "├─";
        const cls = i === parts.length - 1 ? "leaf" : "";
        html += '<span class="branch">' + indent + branch + '</span> <span class="node ' + cls + '">' + escapeHtml(part) + '</span>\n';
      });
      tree.innerHTML = html;

      const av = head.availability;
      const avClass = av.available ? "ok" : "bad";
      meta.innerHTML = `
        <div class="meta-card"><h4>Availability (mock)</h4><div class="val ${avClass}">${av.available ? "● Available" : "● Registered"}</div></div>
        <div class="meta-card"><h4>Registrar (mock)</h4><div class="val">${escapeHtml(av.registrar)}</div></div>
        <div class="meta-card"><h4>Price / year (mock)</h4><div class="val">$${av.price}</div></div>

        <div class="meta-card"><h4>Port / Scheme</h4><div class="val">${head.port} / ${escapeHtml(head.scheme)}</div></div>

    function paintHistory(){

    function generate(){
      const p = readParams();
      state.params = p;
      state.records = buildRecords(p);
      $("#matrixFields").style.display = p.mode === "matrix" ? "block" : "none";

      paintHeadline();
      paintStats();
      paintCompanyAnalysis();
      paintTreeAndMeta();
      buildTabs();
      paintOutput();

      /* add to history (single only) */
      if(p.mode === "single" && state.records.length){
        state.history.unshift({fqdn:state.records[0].fqdn, at:Date.now(), params:p});
        state.history = state.history.slice(0, 40);
        persist();
        paintHistory();
      }
    }

    /* --- events --- */
    $("#genBtn").addEventListener("click", generate);
    $("#diceBtn").addEventListener("click", () => {
      const p = readParams();
      const rng = makeRng("dice-" + Date.now() + "-" + Math.random());
      $("#company").value = generateFakeCompany(p, rng);
      generate();
    });
    $("#copyBtn").addEventListener("click", () => copy(LAST_TEXT, "Output copied"));
    $("#dlBtn").addEventListener("click", () => {
      const p = state.params;
      const extMap = {json:"json", yaml:"yaml", csv:"csv", bind:"zone", terraform:"tf",
                      nginx:"conf", caddy:"Caddyfile", k8s:"yaml", "docker-compose":"yml"};
      const ext = extMap[CURRENT_FORMAT] || "txt";
      const blob = new Blob([LAST_TEXT], {type:"text/plain;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "toolforge_" + slug(p.company || "domain") + "_" + CURRENT_FORMAT + "_" + Date.now().toString(36) + "." + ext;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast("Downloaded");
    });
    $("#rerollBtn").addEventListener("click", () => {
      $("#seed").value = "hg-" + Math.random().toString(36).slice(2,10);
      generate();
    });
    $("#favBtn").addEventListener("click", () => {
      if(!state.records.length) return;
      const r = state.records[0];
      if(state.favorites.some(f => f.fqdn === r.fqdn)){ toast("Already favorited"); return; }
      state.favorites.unshift({fqdn:r.fqdn, at:Date.now(), record:r});
      state.favorites = state.favorites.slice(0, 60);
      persist(); paintFavorites();
      toast("★ Favorited");
    });

    $("#clearHist").addEventListener("click", () => {
      state.history = []; persist(); paintHistory();
    });
    $("#clearFav").addEventListener("click", () => {
      state.favorites = []; persist(); paintFavorites();
    });
    $("#exportFav").addEventListener("click", () => {
      if(!state.favorites.length){ toast("Nothing to export"); return; }
      const blob = new Blob([JSON.stringify(state.favorites, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "toolforge_favorites_" + Date.now().toString(36) + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast("Exported");
    });

    /* delegation for label chips & lists */
    $("#labelsBar").addEventListener("click", e => {
      const chip = e.target.closest("[data-copy]");
      if(chip) copy(chip.dataset.copy, "Label copied");
    });
    $("#histList").addEventListener("click", e => {
      const item = e.target.closest("[data-idx]");
      if(!item) return;
      const h = state.history[Number(item.dataset.idx)];
      if(!h || !h.params) return;
      applyPreset(h.params);
    });
    $("#favList").addEventListener("click", e => {
      const cp = e.target.closest("[data-copy]");
      if(cp){ copy(cp.dataset.copy, "Copied"); return; }
      const rm = e.target.closest("[data-remove]");
      if(rm){
        state.favorites.splice(Number(rm.dataset.remove), 1);
        persist(); paintFavorites();
      }
    });

    /* mode toggle */
    $("#mode").addEventListener("change", () => {
      $("#matrixFields").style.display = $("#mode").value === "matrix" ? "block" : "none";
    });

    /* live regeneration (debounced) */
    let tmr;
    const ctrls = $(".controls");
    ctrls.addEventListener("input", e => {
      if(e.target.id === "mode" || e.target.id === "regionSet") return;
      clearTimeout(tmr); tmr = setTimeout(generate, 220);
    });
    ctrls.addEventListener("change", e => {
      if(e.target.id === "regionSet") return;
      clearTimeout(tmr); tmr = setTimeout(generate, 60);
    });

    /* keyboard */
    const keyHandler = e => {
      if(!document.body.contains(ctrls)) { document.removeEventListener("keydown", keyHandler); return; }
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if(e.key === "d" || e.key === "D"){ e.preventDefault(); $("#diceBtn").click(); }
      if(e.key === "f" || e.key === "F"){ e.preventDefault(); $("#favBtn").click(); }
      if(e.key === "r" || e.key === "R"){ e.preventDefault(); $("#rerollBtn").click(); }
    };
    document.addEventListener("keydown", keyHandler);

    /* global shortcuts handled in main router */
    window.__hgGenerate = generate;

    /* initial */
    generate();
  }

  registerTool({
    id:"hypergen",
    name:"HYPERGEN",
    icon:"◈",
    star:true,
    desc:"Domain & fake company synthesis engine",
    render:renderHypergen
  });
})();

function splitWords(s){
  return s.replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/[_\-]+/g," ")
    .split(/[^A-Za-z0-9]+/).filter(Boolean);
}

  desc:"Strong random passwords with entropy meter.",
  render(root){
    const sets = {lower:"abcdefghijklmnopqrstuvwxyz", upper:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",
                  digits:"0123456789", symbols:"!@#$%^&*()-_=+[]{};:,.?/"};

          <label class="lab" style="margin-top:14px">Character sets</label>
          <div class="btn-row">
            <label class="check"><input type="checkbox" data-set="lower" checked> lowercase</label>
            <label class="check"><input type="checkbox" data-set="upper" checked> UPPERCASE</label>

            <label class="check"><input type="checkbox" data-set="symbols" checked> symbols</label>

        if(cb.checked){

          if($("#pw-amb").checked) chars = [...chars].filter(c => !ambiguous.includes(c)).join("");
          pool += chars;
        }
      });
      const n = Number(len.value);

      bar.style.width = pct + "%"; bar.style.background = color;

      msg.className = "msg ok";
    };
    len.addEventListener("input", () => { $("#pw-lenval").textContent = len.value; gen(); });
    $$("[data-set], #pw-amb").forEach(el => el.addEventListener("change", gen));
    $("#pw-gen").onclick = gen;
    $("#pw-copy").onclick = () => copy(out.value, "Password copied");
    gen();
  }
});

registerTool({
  id:"timestamp", name:"Timestamp", icon:"⏱️",
  desc:"Convert between Unix timestamps and human dates.",
  render(root){
    root.innerHTML = `
      <div class="tool-head"><h2>⏱️ Timestamp Converter</h2><p>Unix ↔ local date, plus relative time.</p></div>
      <div class="tool-body">
        <div class="panel"><div class="panel-b">
          <label class="lab">Unix timestamp (seconds)</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="ts-unix" inputmode="numeric" style="flex:1">
            <button class="btn primary" id="ts-now">Now</button>
          </div>
          <label class="lab" style="margin-top:14px">Local date &amp; time</label>
          <input type="datetime-local" id="ts-date">
          <div class="stat-row" id="ts-out" style="margin-top:14px"></div>
        </div></div>
      </div>`;
    const unixIn = $("#ts-unix"), dateIn = $("#ts-date"), out = $("#ts-out");
    const toLocalInput = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes());
    const relative = d => {
      const diff = Date.now() - d.getTime(), abs = Math.abs(diff);
      const units = [["year",31536000000],["month",2592000000],["day",86400000],["hour",3600000],["minute",60000],["second",1000]];
      for(const [name, ms] of units){
        if(abs >= ms){ const n = Math.round(abs/ms); return n+" "+name+(n===1?"":"s")+" "+(diff>=0?"ago":"from now"); }
      }
      return "just now";
    };
    const paint = d => {
      const rows = [["Unix (s)",Math.floor(d.getTime()/1000)],["Unix (ms)",d.getTime()],
        ["ISO 8601",d.toISOString()],["UTC",d.toUTCString()],["Local",d.toLocaleString()],["Relative",relative(d)]];
      out.innerHTML = rows.map(([k,v]) =>
        '<div class="mini-stat"><div class="k">'+k+'</div><div class="v" style="font-size:13px;word-break:break-all">'+escapeHtml(String(v))+'</div></div>').join("");
    };
    const fromUnix = () => {
      const n = Number(unixIn.value.trim()); if(!Number.isFinite(n)) return;
      const d = new Date(Math.abs(n) < 1e11 ? n*1000 : n);
      if(isNaN(d)) return;
      dateIn.value = toLocalInput(d); paint(d);
    };
    const fromDate = () => {
      if(!dateIn.value) return;
      const d = new Date(dateIn.value); if(isNaN(d)) return;
      unixIn.value = Math.floor(d.getTime()/1000); paint(d);
    };
    unixIn.addEventListener("input", fromUnix);
    dateIn.addEventListener("input", fromDate);
    $("#ts-now").onclick = () => { const d = new Date(); unixIn.value = Math.floor(d.getTime()/1000); dateIn.value = toLocalInput(d); paint(d); };
    $("#ts-now").click();
  }
});

/* ---------- Color ---------- */
registerTool({
  id:"color", name:"Color Converter", icon:"🎨",
  desc:"HEX ↔ RGB ↔ HSL with tints and shades.",
  render(root){
    root.innerHTML = `
      <div class="tool-head"><h2>🎨 Color Converter</h2><p>HEX, RGB, HSL plus generated tints and shades.</p></div>
      <div class="tool-body">
        <div class="panel"><div class="panel-b">
          <div style="display:flex;gap:10px;align-items:center">
            <input type="color" id="co-pick" value="#4f46e5">
            <input type="text" id="co-hex" value="#4f46e5" spellcheck="false" style="flex:1">
          </div>
          <div class="stat-row" id="co-stats"></div>
          <label class="lab">Tints &amp; shades (click to use)</label>
          <div class="swatches" id="co-sw"></div>
        </div></div>
      </div>`;
    const pick = $("#co-pick"), hexIn = $("#co-hex"), stats = $("#co-stats"), sw = $("#co-sw");
    const hexToRgb = hex => {
      let h = hex.replace("#","").trim();
      if(h.length === 3) h = h.split("").map(c=>c+c).join("");
      if(!/^[0-9a-f]{6}$/i.test(h)) return null;
      const n = parseInt(h,16);
      return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
    };
    const rgbToHex = ({r,g,b}) => "#" + [r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("");
    const rgbToHsl = ({r,g,b}) => {
      r/=255; g/=255; b/=255;
      const max=Math.max(r,g,b), min=Math.min(r,g,b), l=(max+min)/2, d=max-min;
      let h=0,s=0;
      if(d){ s = l>0.5 ? d/(2-max-min) : d/(max+min);
        if(max===r) h=((g-b)/d)%6; else if(max===g) h=(b-r)/d+2; else h=(r-g)/d+4;
        h*=60; if(h<0) h+=360; }
      return {h:Math.round(h), s:Math.round(s*100), l:Math.round(l*100)};
    };
    const mix = (a,b,t) => ({r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t});
    const update = hex => {
      const rgb = hexToRgb(hex); if(!rgb) return;
      const hsl = rgbToHsl(rgb), hexNorm = rgbToHex(rgb);
      pick.value = hexNorm; hexIn.value = hexNorm;
      const rows = [["HEX",hexNorm],["RGB","rgb("+rgb.r+", "+rgb.g+", "+rgb.b+")"],
        ["HSL","hsl("+hsl.h+", "+hsl.s+"%, "+hsl.l+"%)"],["CSS var","--color: "+hexNorm+";"]];
      stats.innerHTML = rows.map(([k,v]) =>
        '<div class="mini-stat"><div class="k">'+k+'</div><div class="v" style="font-size:13px;word-break:break-all">'+v+'</div></div>').join("");
      const white = {r:255,g:255,b:255}, black = {r:0,g:0,b:0};
      const shades = [mix(rgb,white,.8),mix(rgb,white,.6),mix(rgb,white,.4),rgb,
        mix(rgb,black,.25),mix(rgb,black,.5),mix(rgb,black,.75)];
      sw.innerHTML = shades.map(c => {
        const h = rgbToHex(c);
        return '<button class="swatch" data-hex="'+h+'" style="background:'+h+'" title="'+h+'"><small>'+h+'</small></button>';
      }).join("");
    };
    pick.addEventListener("input", () => update(pick.value));
    hexIn.addEventListener("input", () => update(hexIn.value));
    sw.addEventListener("click", e => { const b = e.target.closest("[data-hex]"); if(b) update(b.dataset.hex); });
    update("#4f46e5");
  }
});

/* ---------- Lorem ---------- */
registerTool({
  id:"lorem", name:"Lorem Ipsum", icon:"📄",
  desc:"Placeholder paragraphs, sentences or words.",
  render(root){
    const W = ("lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor " +
      "incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation " +
      "ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate " +
      "velit esse cillum eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt " +
      "culpa qui officia deserunt mollit anim id est laborum").split(" ");
    root.innerHTML = `
      <div class="tool-head"><h2>📄 Lorem Ipsum</h2><p>Placeholder text in paragraphs, sentences, or words.</p></div>
      <div class="tool-body">
        <div class="panel"><div class="panel-b">
          <div class="btn-row" style="align-items:center;margin-bottom:12px">
            <label class="check">Type <select id="l-type" style="width:auto;padding:6px 9px;margin-left:6px">
              <option value="paragraphs">Paragraphs</option><option value="sentences">Sentences</option><option value="words">Words</option>
            </select></label>
            <label class="check">Amount <input type="number" id="l-count" min="1" max="50" value="3" style="width:70px;margin-left:6px"></label>
            <button class="btn primary" id="l-gen">Generate</button>
            <button class="btn" id="l-copy">Copy</button>
          </div>
          <textarea id="l-out" rows="12" readonly></textarea>
        </div></div>
      </div>`;
    const out = $("#l-out");
    const word = () => W[Math.floor(Math.random()*W.length)];
    const sent = () => { const n = 6 + Math.floor(Math.random()*9); const w = Array.from({length:n}, word); return cap(w.join(" ")) + "."; };
    const para = () => Array.from({length:3+Math.floor(Math.random()*4)}, sent).join(" ");
    const gen = () => {
      const n = Math.max(1, Math.min(50, Number($("#l-count").value) || 1));
      const type = $("#l-type").value;
      let text;
      if(type === "words") text = Array.from({length:n}, word).join(" ");
      else if(type === "sentences") text = Array.from({length:n}, sent).join(" ");
      else text = Array.from({length:n}, para).join("\n\n");
      out.value = text;
    };
    $("#l-gen").onclick = gen;
    $("#l-copy").onclick = () => copy(out.value, "Lorem ipsum copied");
    gen();
  }
});

/* ============================================================
   ROUTER + SHELL
   ============================================================ */
function renderNav(){
  const nav = $("#toolNav");
  nav.innerHTML = TOOLS.map(t =>
    '<a class="tool-link" data-id="'+t.id+'" href="#/'+t.id+'">' +
      '<span class="ic">'+t.icon+'</span>' +
      '<span class="nm">'+t.name+'</span>' +
      (t.star ? '<span class="star">★</span>' : '') +
    '</a>').join("");
}

function route(){
  const id = location.hash.replace(/^#\/?/, "") || "hypergen";
  const tool = TOOLS.find(t => t.id === id) || TOOLS[0];
  $$(".tool-link").forEach(a => a.classList.toggle("on", a.dataset.id === tool.id));
  const main = $("#main");
  main.innerHTML = "";
  tool.render(main);
  window.scrollTo({top:0, behavior:"smooth"});
  document.title = tool.name + " · Toolforge";
}

/* Theme */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  localStorage.setItem("toolforge.theme", t);
  $("#themeBtn").textContent = t === "dark" ? "🌙" : "☀️";
}
(function initTheme(){
  const saved = localStorage.getItem("toolforge.theme");
  const sys = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(saved || sys);
})();
$("#themeBtn").addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

/* Keyboard shortcuts */
document.addEventListener("keydown", e => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  const inField = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if((e.ctrlKey || e.metaKey) && e.key === "Enter"){
    if(window.__hgGenerate && location.hash.includes("hypergen")){ e.preventDefault(); window.__hgGenerate(); }
  }
  if(inField) return;
  if(e.key === "t" || e.key === "T"){ $("#themeBtn").click(); }
});

window.addEventListener("hashchange", route);
renderNav();
route();
</script>
